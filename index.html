  Edit only the SETTINGS block below (between the dashed lines).

  // ---------------------------------------------------------------

  // false = big "Tap to Punch" button (use until HYD's own link arrives)

  clockFitHeight: 560,     // px of the clock page to fit in the column

    // { name: "Mike R.",  from: "2026-11-10", to: "2026-11-11" },
    // { name: "Dana P.",  from: "2026-11-12", note: "Out 12:00" },

  // from / to (YYYY-MM-DD, optional): card only shows between these dates,
  //   so you can load things ahead and they drop off on their own.

    // { type: "Event", title: "Holiday Party", text: "Sat, Dec 12 · details from your supervisor", to: "2026-12-12" },
    // { type: "Happy Birthday", title: "Dana P.", text: "Wishing you a great year!", from: "2026-11-14", to: "2026-11-14" },

  slidesArrows: true,      // show Google's ‹ › bar under the slide

  slidesReloadMinutes: 10, // reload the deck to pick up edits

  // Column widths (punch, time off, announcements). Equal = 1,1,1
  columnWidths: [1, 1, 1],

  // Reload the whole screen every X minutes to pick up changes.
  refreshMinutes: 30

<style>
  /* HYD brand (from machiningtechllc.com): navy #232638, logo red #9B1B22,
     fonts Space Grotesk (headings) / Open Sans (text) */
  :root{
    --bg:#eceef2; --panel:#ffffff; --ink:#1d2030; --muted:#5f6475;
    --brand:#232638; --brand-ink:#ffffff; --accent:#9b1b22;
    --punch:#1f8a4c; --punch-dark:#176b3a; --line:#d9dce3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;overflow:hidden}
  body{display:flex;flex-direction:column}
  header .name, header .time, .col h2, .punch-btn, .slide .big{
    font-family:"Space Grotesk","Open Sans",system-ui,Arial,sans-serif}

  header{background:var(--brand);color:var(--brand-ink);
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 22px;flex:0 0 auto;border-bottom:4px solid var(--accent)}
  header .brandbox{display:flex;align-items:center;gap:16px}
  header .logo{height:58px;border-radius:4px;display:block}
  header .name{font-size:22px;font-weight:700;letter-spacing:.3px}
  header .clock{text-align:right;line-height:1.1}
  header .time{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  header .date{font-size:14px;opacity:.85}

  main{flex:1;display:grid;gap:14px;padding:14px;min-height:0}
  .col{background:var(--panel);border:1px solid var(--brand);border-radius:6px;
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .col h2{font-size:17px;text-transform:uppercase;letter-spacing:1.5px;
    color:#fff;background:var(--brand);padding:12px 20px;border-bottom:3px solid var(--accent);
    display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .col h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .body{flex:1;min-height:0;position:relative}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}

  /* Punch */
  .punch-wrap{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;padding:20px;text-align:center}
  .punch-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:100%;max-width:320px;aspect-ratio:1/1;border-radius:24px;border:0;
    background:var(--punch);color:#fff;font-size:30px;font-weight:800;
    text-decoration:none;box-shadow:0 6px 0 var(--punch-dark);cursor:pointer}
  .punch-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--punch-dark)}
  .punch-btn svg{width:76px;height:76px;margin-bottom:12px}
  .punch-note{font-size:15px;color:var(--muted);line-height:1.4;max-width:300px}
  .punch-note b{color:var(--ink)}

  /* Sample content */
  .sample-tag{position:absolute;top:8px;right:10px;font-size:11px;font-weight:700;
    background:#fff4d6;color:#7a5a00;border:1px solid #f0d58a;border-radius:20px;
    padding:2px 9px;z-index:2}
  .agenda{list-style:none;padding:8px 16px;overflow:auto;height:100%}
  .agenda .day{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.6px;margin:14px 0 6px}
  .agenda .day:first-child{margin-top:4px}
  .agenda .ev{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;
    border-radius:10px;background:#f3f6fa;margin-bottom:6px;font-size:16px}
  .agenda .ev span:last-child{color:var(--muted);font-size:14px;white-space:nowrap}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:26px;text-align:center;gap:14px;opacity:0;transition:opacity .8s}
  .slide.on{opacity:1}
  .slide .kicker{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent)}
  .slide .big{font-size:26px;font-weight:800;color:var(--brand);line-height:1.2}
  .slide p{font-size:16px;color:var(--muted);line-height:1.45}
  .dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--accent)}

  /* Who's Out week grids */
  .weeks{height:100%;overflow-y:auto;padding:10px 12px 40px;-webkit-overflow-scrolling:touch}
  .week{margin-bottom:16px}
  .wk-head{display:flex;justify-content:space-between;align-items:baseline;
    font-family:"Space Grotesk","Open Sans",sans-serif;font-weight:700;
    font-size:15px;color:var(--brand);margin:0 2px 6px}
  .wk-head span:last-child{font-size:13px;color:var(--muted);font-weight:600}
  .wk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .wk-day{background:#f3f4f7;border-radius:8px;padding:5px 4px 6px;min-height:84px;
    display:flex;flex-direction:column;gap:4px}
  .wk-day.today{background:#fff;outline:2px solid var(--accent)}
  .wk-day.past{opacity:.45}
  .wk-dname{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
    display:flex;justify-content:space-between;padding:0 2px}
  .wk-dname b{color:var(--ink)}
  .wk-day.today .wk-dname, .wk-day.today .wk-dname b{color:var(--accent)}
  .chip{background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 4px;
    font-size:12px;font-weight:600;line-height:1.2;overflow-wrap:break-word;hyphens:auto}
  .chip small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
  .chip.hol{background:var(--accent);border-color:var(--accent);color:#fff}
  .more{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:12px;font-weight:600;
    color:var(--muted);padding:14px 0 8px;background:linear-gradient(rgba(255,255,255,0),#fff 55%);
    pointer-events:none;transition:opacity .3s}
  .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;line-height:1;
    color:var(--line);padding:10px 8px;pointer-events:none;font-weight:300}
  .nav.prev{left:4px} .nav.next{right:4px}
  /* Column header button */
  .col h2{min-height:52px}
  .col h2 .hbtn{margin-left:auto;margin-top:-6px;margin-bottom:-6px;
    font:700 12px "Space Grotesk","Open Sans",sans-serif;letter-spacing:1.2px;text-transform:uppercase;
    color:#fff;background:transparent;border:1.5px solid #fff;border-radius:3px;
    padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;position:relative}
  .col h2 .hbtn svg{width:15px;height:15px}
  .col h2 .hbtn:active{background:rgba(255,255,255,.15)}
  #pickDate{position:absolute;right:0;top:100%;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}
  #calBody{background:#F0F4F9}
  .plus-cover{position:absolute;right:0;bottom:0;width:60px;height:60px;background:#F0F4F9;z-index:3}
  /* Slides frame */
  .slides-wrap{position:absolute;inset:0;background:#fff;display:flex;align-items:center;justify-content:center}
  .slides-box{position:relative;overflow:hidden;background:#fff}
  .slides-box iframe{position:absolute;inset:0;width:100%;height:100%}
  .slides-cover{position:absolute;right:0;bottom:0;background:#fff;z-index:2}
  /* Punch clock inside column */
  .clock-wrap{position:absolute;inset:0;display:flex;flex-direction:column}
  .clock-view{flex:1;position:relative;overflow:hidden;min-height:0}
  .clock-view iframe{position:absolute;top:0;left:50%;border:0;transform-origin:top left}
  .clock-help{flex:0 0 auto;text-align:center;padding:6px}
  .clock-help a{font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;
    border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:inline-block}
  .lunch-box{flex:0 0 auto;margin:8px 12px 12px;padding:10px 12px;border-radius:10px;
    background:#fbf1f1;border:1px solid #ecc9cb;color:var(--ink);font-size:14px;line-height:1.4;text-align:center}
  .lunch-box .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
</style>
</head>

<script>
const S = SETTINGS;
document.getElementById('companyName').textContent = S.companyName;
document.getElementById('grid').style.gridTemplateColumns =
  S.columnWidths.map(w => w + 'fr').join(' ');

// Clock
function tick(){
  const d = new Date();
  document.getElementById('time').textContent =
    d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  document.getElementById('date').textContent =
    d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}
tick(); setInterval(tick, 1000);

function frame(src){ const f=document.createElement('iframe'); f.src=src; f.setAttribute('allowfullscreen',''); return f; }
function sampleTag(el){ const t=document.createElement('div'); t.className='sample-tag'; t.textContent='SAMPLE'; el.appendChild(t); }

// Punch column
(function(){
  const el = document.getElementById('punchBody');
  const lunch = `<div class="lunch-box"><span class="lbl">Lunch &amp; Breaks</span>${S.lunchReminder}</div>`;
  if (S.punchUrl && S.punchInsideColumn){
    el.innerHTML = `<div class="clock-wrap">
        <div class="clock-view" id="clockView"></div>
        <div class="clock-help"><a href="${S.punchUrl}">Clock not loading? Tap here</a></div>
        ${lunch}</div>`;
    const view = document.getElementById('clockView');
    const f = document.createElement('iframe');
    f.setAttribute('scrolling','no'); f.src = S.punchUrl;
    f.style.width = S.clockPageWidth + 'px';
    f.style.height = (S.clockTrimTop + S.clockFitHeight) + 'px';
    view.appendChild(f);
    const fit = () => {
      const sc = Math.min(view.clientWidth / S.clockPageWidth, view.clientHeight / S.clockFitHeight);
      f.style.transform = `translate(${-S.clockPageWidth*sc/2}px, ${-S.clockTrimTop*sc}px) scale(${sc})`;
    };
    fit(); new ResizeObserver(fit).observe(view);
    // Reset the clock a while after someone taps into it
    let resetT = null;
    setInterval(() => {
      if (document.activeElement === f){
        clearTimeout(resetT);
        resetT = setTimeout(() => { f.src = S.punchUrl; f.blur(); window.focus(); }, S.clockResetSeconds*1000);
        window.focus();
      }
    }, 1000);
    return;
  }
  el.innerHTML = `
    <div class="clock-wrap">
      <div class="punch-wrap" style="flex:1;height:auto">
        <a class="punch-btn" id="punchBtn" href="${S.punchUrl || '#'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Tap to Punch
        </a>
        <div class="punch-note">Punch <b>in</b>, <b>out for lunch</b>, <b>back from lunch</b>, and <b>out</b> at the end of your shift.</div>
      </div>
      ${lunch}
    </div>`;
  if (!S.punchUrl){
    sampleTag(el);
    document.getElementById('punchBtn').addEventListener('click', e => e.preventDefault());
  }
})();

// Who's Out column — Mon–Fri week grids, stacked and scrollable
(async function(){
  const el = document.getElementById('calBody');
  const pad = n => String(n).padStart(2,'0');
  const key = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

  const today = new Date(); today.setHours(0,0,0,0);
  // Start on this week's Monday (or next Monday on weekends)
  let monday = addDays(today, -((today.getDay()+6)%7));
  if (today.getDay()===0 || today.getDay()===6) monday = addDays(monday, 7);

  const calId = (S.calendarId || '').trim();
  const picker = document.getElementById('pickDate');
  document.getElementById('pickDateBtn').addEventListener('click', () => {
    try { picker.showPicker(); } catch (e) { picker.focus(); picker.click(); }
  });
  let backT = null;
  const goBackLater = (fn) => { clearTimeout(backT); backT = setTimeout(fn, (S.calendarResetSeconds||90)*1000); };
  if (calId && !S.calendarApiKey){
    const base = 'https://calendar.google.com/calendar/embed?src=' + encodeURIComponent(calId) +
      '&mode=AGENDA&ctz=America%2FNew_York&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&showDate=0&wkst=2';
    const f = frame(base); el.appendChild(f);
    el.insertAdjacentHTML('beforeend', '<div class="plus-cover"></div>');
    // Self-healing: reload on a timer (unless someone is browsing a picked date)
    if (S.calendarReloadMinutes > 0) setInterval(() => { if (f.src.indexOf('&dates=') < 0) f.src = base; },
      S.calendarReloadMinutes*60*1000);
    picker.addEventListener('change', () => {
      if (!picker.value) return;
      const d = parse(picker.value), ymd = x => key(x).replace(/-/g,'');
      f.src = base + '&dates=' + ymd(d) + '/' + ymd(addDays(d, 60));
      picker.value = '';
      goBackLater(() => { f.src = base; });
    });
    return;
  }
  let list = (S.timeOff || []).filter(e => e && e.name && e.from);
  if (calId){
    try {
      const tMin = new Date(monday), tMax = addDays(monday, 7*26);
      const url = 'https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(calId) +
        '/events?singleEvents=true&orderBy=startTime&maxResults=500&key=' + encodeURIComponent(S.calendarApiKey) +
        '&timeMin=' + tMin.toISOString() + '&timeMax=' + tMax.toISOString();
      const r = await fetch(url); if (!r.ok) throw new Error(r.status);
      const items = (await r.json()).items || [];
      list = items.map(ev => {
        const name = ev.summary || 'Out';
        const holiday = /closed|holiday|shutdown/i.test(name);
        if (ev.start.date){                       // all-day (end date is exclusive)
          const end = addDays(parse(ev.end.date), -1);
          return {name, from: ev.start.date, to: key(end), holiday};
        }
        const st = new Date(ev.start.dateTime), en = new Date(ev.end.dateTime);
        const t = d => d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
        return {name, from: key(st), to: key(en), note: t(st) + '–' + t(en), holiday};
      });
    } catch (err){
      list = []; el.innerHTML = '<div style="padding:20px;color:#5f6475">Calendar unavailable — check connection.</div>';
      return;
    }
  }
  const isSample = list.length === 0 && !calId;
  if (isSample){
    const k = n => key(addDays(monday, n));
    list = [
      {name:'Mike R.', from:k(0), to:k(1)},
      {name:'Dana P.', from:k(0), note:'Out 12:00'},
      {name:'Steve L.', from:k(3), to:k(4)},
      {name:'Kim T.', from:k(3), note:'In 10:00'},
      {name:'Jose M.', from:k(7), to:k(11)},
      {name:'Closed', from:k(10), to:k(11), holiday:true},
      {name:'Dana P.', from:k(15), note:'AM'},
      {name:'Mike R.', from:k(21), to:k(22)}
    ];
  }

  // Build day -> entries map
  const byDay = {};
  list.forEach(e => {
    const a = parse(e.from), b = parse(e.to || e.from);
    for (let d = new Date(a); d <= b; d = addDays(d,1)){
      (byDay[key(d)] = byDay[key(d)] || []).push(e);
    }
  });

  const fmt = (d,o) => d.toLocaleDateString('en-US', o);
  let html = '<div class="weeks" id="weeks">';
  // Always show weeksToShow; extend to cover the furthest absence
  let lastDay = monday;
  list.forEach(e => { const b = parse(e.to || e.from); if (b > lastDay) lastDay = b; });
  const weeksNeeded = Math.floor((lastDay - monday) / (7*864e5)) + 1;
  const totalWeeks = Math.min(52, Math.max(S.weeksToShow || 3, weeksNeeded));
  for (let w = 0; w < totalWeeks; w++){
    const mon = addDays(monday, w*7), fri = addDays(mon, 4);
    const label = w===0 ? (monday > today ? 'Next Week' : 'This Week')
                : w===1 && monday <= today ? 'Next Week'
                : 'Week of ' + fmt(mon,{month:'short',day:'numeric'});
    const range = fmt(mon,{month:'short',day:'numeric'}) + ' – ' +
      (mon.getMonth()===fri.getMonth() ? fri.getDate() : fmt(fri,{month:'short',day:'numeric'}));
    html += `<div class="week"><div class="wk-head"><span>${label}</span><span>${range}</span></div><div class="wk-grid">`;
    for (let i = 0; i < 5; i++){
      const d = addDays(mon, i), k = key(d), items = byDay[k] || [];
      const isToday = k === key(today), past = d < today;
      html += `<div class="wk-day${isToday?' today':''}${past?' past':''}">
        <div class="wk-dname">${['Mon','Tue','Wed','Thu','Fri'][i]}<b>${d.getDate()}</b></div>`;
      items.sort((a,b)=> (b.holiday?1:0)-(a.holiday?1:0)).forEach(e => {
        html += `<div class="chip${e.holiday?' hol':''}">${e.name}${e.note?`<small>${e.note}</small>`:''}</div>`;
      });
      html += `</div>`;
    }
    html += `</div></div>`;
  }
  html += '</div><div class="more" id="more">Swipe up for more weeks ▾</div>';
  el.innerHTML = html;
  if (isSample){ sampleTag(el); el.querySelector('.sample-tag').style.cssText='top:auto;bottom:8px;right:10px'; }

  // Hide hint once scrolled; jump back to This Week after idle
  const box = document.getElementById('weeks'), more = document.getElementById('more');
  picker.addEventListener('change', () => {
    if (!picker.value) return;
    const d = parse(picker.value), idx = Math.floor((addDays(d, -((d.getDay()+6)%7)) - monday) / (7*864e5));
    const wk = box.querySelectorAll('.week')[idx];
    if (wk) box.scrollTo({top: wk.offsetTop - 10, behavior:'smooth'});
    picker.value = '';
  });
  if (box.scrollHeight <= box.clientHeight + 4) more.style.display = 'none';
  let idle;
  box.addEventListener('scroll', () => {
    more.style.opacity = box.scrollTop > 20 ? 0 : 1;
    clearTimeout(idle);
    idle = setTimeout(() => box.scrollTo({top:0, behavior:'smooth'}), (S.scrollBackSeconds||45)*1000);
  }, {passive:true});
})();

// Announcements column
(function(){
  const el = document.getElementById('annBody');
  let u = (S.newsSlidesLink || '').trim();
  if (u){
    u = u.replace('/pub?', '/embed?').replace(/\/pub$/, '/embed')
         .replace(/([?&])(start|loop|delayms|rm)=[^&]*/g,'$1').replace(/[?&]+$/,'').replace(/&&+/g,'&');
    u += (u.includes('?')?'&':'?') + 'start=true&loop=true&delayms=' + (S.secondsPerSlide*1000) +
         (S.slidesArrows ? '' : '&rm=minimal');
    const bar = S.slidesArrows ? (S.slidesBarHeight || 30) : 0;
    el.innerHTML = '<div class="slides-wrap"><div class="slides-box" id="slidesBox"></div></div>';
    const box = document.getElementById('slidesBox'), wrap = box.parentNode;
    const f = frame(u); box.appendChild(f);
    if (bar){
      const c = document.createElement('div'); c.className = 'slides-cover';
      c.style.height = bar + 'px'; c.style.width = (S.slidesCoverPercent || 72) + '%';
      box.appendChild(c);
    }
    const fit = () => {
      const W = wrap.clientWidth - 16, H = wrap.clientHeight - 16;
      if (!S.slideWidth || !S.slideHeight){ box.style.width = W+'px'; box.style.height = H+'px'; return; }
      const sc = Math.min(W / S.slideWidth, (H - bar) / S.slideHeight);
      box.style.width = Math.floor(S.slideWidth*sc) + 'px';
      box.style.height = Math.floor(S.slideHeight*sc + bar) + 'px';
    };
    fit(); new ResizeObserver(fit).observe(wrap);
    if (S.slidesReloadMinutes > 0) setInterval(() => { f.src = u; }, S.slidesReloadMinutes*60*1000);
    return;
  }
  const pad = n => String(n).padStart(2,'0');
  const today = new Date(); today.setHours(0,0,0,0);
  const tkey = today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  const esc = t => String(t||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let news = (S.news || []).filter(n => n && n.title);
  const isSample = news.length === 0;
  if (isSample) news = [
    {type:'Reminder', title:'Punch out for lunch', text:'A 30-minute meal break is required after 6 hours. Please punch out and back in.'},
    {type:'Happy Birthday', title:'🎂 Dana P.', text:'Wishing you a great year!'},
    {type:'Anniversary', title:'10 Years — Steve L.', text:'Thank you for a decade of great work.'},
    {type:'Safety', title:'First aid kit & AED', text:'Located by the front office. Report every injury to your supervisor the same day.'}
  ];
  // Only cards whose date window includes today
  news = news.filter(n => (!n.from || n.from <= tkey) && (!n.to || n.to >= tkey));
  // Auto "Coming Up" cards for company closures within 3 weeks
  const parse = x => { const [y,m,d]=x.split('-').map(Number); return new Date(y,m-1,d); };
  (S.timeOff || []).filter(e => e && e.holiday && e.from).forEach(e => {
    const a = parse(e.from), b = parse(e.to || e.from), days = (a - today)/864e5;
    if (days >= 0 && days <= 21){
      const o = {weekday:'short', month:'short', day:'numeric'};
      const when = a.toLocaleDateString('en-US',o) + (e.to && e.to!==e.from ? ' – ' + b.toLocaleDateString('en-US',o) : '');
      news.unshift({type:'Coming Up', title:e.name, text:'Closed ' + when});
    }
  });
  if (!news.length) news = [{type:'', title:'Have a safe day!', text:''}];
  if (isSample) sampleTag(el);
  const slides = news.map(n => [esc(n.type), esc(n.title), esc(n.text)]);
  el.innerHTML += slides.map((s,i)=>`<div class="slide${i?'':' on'}">
      <div class="kicker">${s[0]}</div><div class="big">${s[1]}</div><p>${s[2]}</p></div>`).join('')
    + `<div class="dots">${slides.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`;
  // Rotation: automatic, plus swipe left/right or tap the left/right side.
  // After someone touches it, it waits 30s before rotating on its own again.
  let i=0, timer; const ss=el.querySelectorAll('.slide'), ds=el.querySelectorAll('.dots i');
  const show = n => { ss[i].classList.remove('on'); ds[i].classList.remove('on');
    i=(n+ss.length)%ss.length; ss[i].classList.add('on'); ds[i].classList.add('on'); };
  const auto = (delay) => { clearInterval(timer); clearTimeout(timer);
    timer = setTimeout(() => { show(i+1); timer = setInterval(() => show(i+1), S.secondsPerSlide*1000); }, delay); };
  auto(S.secondsPerSlide*1000);
  if (ss.length > 1){
    let x0 = null;
    el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
    el.addEventListener('touchend', e => {
      if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40){ show(i + (dx < 0 ? 1 : -1)); auto(30000); }
    });
    el.addEventListener('click', e => {
      const r = el.getBoundingClientRect();
      show(i + (e.clientX - r.left < r.width/2 ? -1 : 1)); auto(30000);
    });
    el.insertAdjacentHTML('beforeend',
      '<div class="nav prev">‹</div><div class="nav next">›</div>');
  }
})();

// Full screen (hides Chrome's address bar): any tap on the page turns it on
function goFull(){
  const d = document.documentElement;
  if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(()=>{});
}
document.addEventListener('pointerdown', goFull);

// Keep the screen on (Screen Wake Lock) — re-requested whenever the page is shown or tapped
let wakeLock = null;
async function keepAwake(){
  try { if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible'){
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } } catch (e) {}
}
keepAwake();
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('pointerdown', keepAwake);
setInterval(keepAwake, 60000);

// When Wi-Fi comes back after dropping, reload so no column stays broken
window.addEventListener('online', () => setTimeout(() => location.reload(), 3000));

// Periodic refresh
if (S.refreshMinutes > 0) setTimeout(()=>location.reload(), S.refreshMinutes*60*1000);
</script>
